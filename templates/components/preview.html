{% comment %}
  Product preview: an HTML/CSS picture of a project's interface.
  Usage: {% include "components/preview.html" with p=project %}
  All content is sample data.
{% endcomment %}
<figure class="ui" aria-label="{{ p.title }} interface preview with sample data">
  <div class="ui__bar">
    <span class="ui__app"><i class="is-accent" aria-hidden="true"></i>{{ p.title }}</span>
  </div>

  {% if p.slug == "documind" %}
    <div class="ui__body">
      <div class="ui-msg ui-msg--me">How many days of leave can a student take each term?</div>
      <div class="ui-msg ui-msg--ai">
        Up to 10 days per term, with a note from the class tutor. Longer leave needs the principal’s approval.
        <div><span class="ui-src">{% include "components/icon.html" with name="file" %}College handbook &middot; p.14</span></div>
      </div>
      <div class="ui-msg ui-msg--ai ui-muted">Not found in your documents: “canteen menu”. I won’t guess.</div>
      <div class="ui-input">Ask about your documents&hellip; <b>{% include "components/icon.html" with name="send" %}</b></div>
    </div>

  {% elif p.slug == "insightdesk" %}
    <div class="ui__body">
      <div class="ui-msg ui-msg--me">Which region sold the most in Q3?</div>
      <div>
        <div class="ui-h">Q3 sales by region</div>
        <div class="ui-bars mt-3" aria-hidden="true"><span class="h-60"></span><span class="h-90 is-hi"></span><span class="h-45"></span><span class="h-70"></span></div>
        <div class="ui-axis" aria-hidden="true"><span>North</span><span>South</span><span>East</span><span>West</span></div>
      </div>
      <div class="ui-code"><span>df</span>.groupby("region")["sales"].sum()</div>
    </div>

  {% elif p.slug == "shopassist" %}
    <div class="ui__body">
      <div class="ui-msg ui-msg--me">Waterproof running shoes, size 9, under $80</div>
      <div class="ui-row"><span class="ui-thumb" aria-hidden="true"></span><div class="stack-0"><div class="ui-row__t">Trail Runner Dry</div><div class="ui-row__s">Waterproof &middot; Size 9 in stock</div></div><span class="ui-pill">$74</span></div>
      <div class="ui-row"><span class="ui-thumb ui-thumb--b" aria-hidden="true"></span><div><div class="ui-row__t">Storm Pace 2</div><div class="ui-row__s">Water-resistant &middot; Size 9 in stock</div></div><span class="ui-pill">$79</span></div>
      <div class="ui-muted">2 matches from the catalog. Tap a product to open it.</div>
    </div>

  {% elif p.slug == "bookit" %}
    <div class="ui__body">
      <div class="ui-h">Sample venue &middot; Pitch A &middot; Saturday</div>
      <div class="ui-slots">
        <div class="ui-slot is-taken">06:00<small>Booked</small></div>
        <div class="ui-slot">07:00<small>Free</small></div>
        <div class="ui-slot is-picked">08:00<small>Your pick</small></div>
        <div class="ui-slot is-taken">17:00<small>Booked</small></div>
        <div class="ui-slot">18:00<small>Free</small></div>
        <div class="ui-slot is-taken">19:00<small>Booked</small></div>
      </div>
      <div class="ui-row"><div><div class="ui-row__t">08:00 is held for you</div><div class="ui-row__s">Confirmation and QR code sent by email</div></div><span class="ui-pill ui-pill--ok">Held</span></div>
    </div>

  {% elif p.slug == "supportflow" %}
    <div class="ui__body">
      <div class="ui-row"><div><div class="ui-row__t">“My order arrived broken”</div><div class="ui-row__s">Topic: Returns &middot; Draft reply ready</div></div><span class="ui-pill ui-pill--urgent">Urgent</span></div>
      <div class="ui-row"><div><div class="ui-row__t">“Can I change my address?”</div><div class="ui-row__s">Topic: Account &middot; Draft reply ready</div></div><span class="ui-pill ui-pill--warn">Normal</span></div>
      <div class="ui-row"><div><div class="ui-row__t">“Do you ship abroad?”</div><div class="ui-row__s">Topic: Shipping &middot; Draft reply ready</div></div><span class="ui-pill">Low</span></div>
      <div class="ui-muted">A person approves every reply before it is sent.</div>
    </div>

  {% elif p.slug == "forecastboard" %}
    <div class="ui__body">
      <div class="ui-h">Weekly units &middot; next 6 weeks</div>
      <div class="ui-chart" aria-hidden="true">
        <svg viewBox="0 0 320 120" preserveAspectRatio="none">
          <path class="fc-band" d="M200 52 L230 44 L260 50 L290 38 L320 42 L320 78 L290 72 L260 82 L230 76 L200 70 Z"/>
          <path class="fc-actual" pathLength="1" d="M0 86 L30 80 L60 84 L90 70 L120 74 L150 62 L180 66 L200 60"/>
          <path class="fc-base" d="M200 60 L320 60"/>
          <path class="fc-pred" pathLength="1" d="M200 60 L230 60 L260 66 L290 55 L320 60"/>
          <line class="fc-now" x1="200" y1="8" x2="200" y2="116"/>
        </svg>
      </div>
      <div class="ui-legend"><span><i></i>Past sales</span><span><i class="is-accent"></i>Forecast</span><span><i class="is-band"></i>Error range</span><span><i class="is-dash"></i>Simple baseline</span></div>
    </div>

  {% elif p.slug == "voicedesk" %}
    <div class="ui__body">
      <div class="ui-h">Sample clinic &middot; after-hours assistant</div>
      <div class="ui-mic" aria-hidden="true">{% include "components/icon.html" with name="mic" %}</div>
      <div class="ui-wave" aria-hidden="true"><span class="h-30"></span><span class="h-60"></span><span class="h-90"></span><span class="h-50"></span><span class="h-75"></span><span class="h-40"></span><span class="h-65"></span><span class="h-35"></span><span class="h-55"></span><span class="h-30"></span></div>
      <div class="ui-msg ui-msg--me">Are you open on Sunday?</div>
      <div class="ui-msg ui-msg--ai">We’re closed on Sundays. I can take a message for Monday morning.</div>
    </div>

  {% elif p.slug == "pagemind" %}
    <div class="ui__body">
      <div class="ui-page">
        <div class="ui-lines" aria-hidden="true"><span class="w-90"></span><span class="w-75"></span><mark></mark><mark></mark><span class="w-90"></span><span class="w-60"></span><span class="w-75"></span></div>
        <div class="ui-side">
          <div class="ui-h">Summary of selection</div>
          <div class="ui-muted">The new policy starts in March and applies to all part-time staff.</div>
          <span class="ui-pill">Saved to history</span>
        </div>
      </div>
      <div class="ui-input">Ask this page a question&hellip; <b>{% include "components/icon.html" with name="send" %}</b></div>
    </div>

  {% elif p.slug == "deskpilot" %}
    <div class="ui__body">
      <div class="ui-input">Rename the invoices in Practice folder by date <b>{% include "components/icon.html" with name="send" %}</b></div>
      <ol class="ui-steps">
        <li>{% include "components/icon.html" with name="check" %}<span>Found 12 PDF files</span><span class="ui-muted">read only</span></li>
        <li>{% include "components/icon.html" with name="check" %}<span>Planned new names: 2026-03-04_invoice.pdf&hellip;</span><span class="ui-muted">preview</span></li>
        <li>{% include "components/icon.html" with name="info" %}<span>Rename 12 files?</span><span class="ui-pill ui-pill--warn">Asks first</span></li>
      </ol>
      <div class="ui-muted">Every action is logged. File moves can be undone.</div>
    </div>

  {% elif p.slug == "reportbot" %}
    <div class="ui__body">
      <div class="ui-h">Weekly sales report &middot; sample sheet</div>
      <div class="ui-kpis">
        <div class="ui-kpi"><span class="ui-muted">Orders</span><b>412</b></div>
        <div class="ui-kpi"><span class="ui-muted">Revenue</span><b>$18.2k</b></div>
        <div class="ui-kpi"><span class="ui-muted">Returns</span><b>9</b></div>
      </div>
      <div class="ui-bars ui-bars--sm" aria-hidden="true"><span class="h-40"></span><span class="h-55"></span><span class="h-50"></span><span class="h-70"></span><span class="h-65"></span><span class="h-80 is-hi"></span><span class="h-60"></span></div>
      <div class="ui-muted">Numbers calculated with code. The written summary is kept separate.</div>
    </div>

  {% else %}
    <div class="ui__body">
      <div class="ui-h">{{ p.headline }}</div>
      <div class="ui-muted">{{ p.problem }}</div>
    </div>
  {% endif %}
</figure>
