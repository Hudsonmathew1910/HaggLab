<div class="field-grid field-grid--try">
  <div class="field">
    <label for="try-category">Category</label>
    <select id="try-category" name="category">{% for key, name in spec.fields.category.1 %}<option value="{{ key }}">{{ name }}</option>{% endfor %}</select>
  </div>
  <div class="field">
    <label for="try-weeks">Weeks ahead</label>
    <input id="try-weeks" name="weeks" type="number" min="1" max="12" value="4" required>
  </div>
</div>
<div class="try-actions"><button type="submit" class="btn btn-primary">Make the forecast {% include "components/icon.html" with name="arrow" %}</button></div>
