<div class="field-grid field-grid--try">
  <div class="field">
    <label for="try-dataset">Dataset</label>
    <select id="try-dataset" name="dataset">{% for key, name in spec.fields.dataset.1 %}<option value="{{ key }}">{{ name }}</option>{% endfor %}</select>
  </div>
  <div class="field">
    <label for="try-message">Your question</label>
    <input id="try-message" name="message" type="text" maxlength="400" placeholder="{{ spec.placeholder }}" required>
  </div>
</div>
<div class="try-actions"><button type="submit" class="btn btn-primary">Get the answer {% include "components/icon.html" with name="arrow" %}</button></div>
{% include "tryit/_examples.html" %}
