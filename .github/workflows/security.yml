name: Weekly security scan

# Runs every Monday, and can be started by hand (Actions tab > Weekly security scan > Run workflow).
# If a package in requirements.txt has a known vulnerability, this run fails and GitHub emails you.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC (11:30 India time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check packages for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off --desc
      - name: Show packages with newer versions
        if: always()
        run: |
          pip install -r requirements.txt
          pip list --outdated
